<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="301" viewBox="0 0 1024 301">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#f82e97"/>
      <stop offset="30%" stop-color="#6e1b60"/>
      <stop offset="62%" stop-color="#7c1f66"/>
      <stop offset="100%" stop-color="#ff2e97"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaffff"/>
      <stop offset="45%" stop-color="#8fe8ff"/>
      <stop offset="100%" stop-color="#4fc9ff"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b1"/>
      <feFlood flood-color="#37c8ff" flood-opacity="0.85" result="c1"/>
      <feComposite in="c1" in2="b1" operator="in" result="g1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="b2"/>
      <feFlood flood-color="#1e90ff" flood-opacity="0.55" result="c2"/>
      <feComposite in="c2" in2="b2" operator="in" result="g2"/>
      <feMerge>
        <feMergeNode in="g2"/>
        <feMergeNode in="g1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#9db8ff" flood-opacity="0.7" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="textClip">
      <use href="#lp0"/>
      <use href="#lp1"/>
      <use href="#lp2"/>
      <use href="#lp3"/>
      <use href="#lp4"/>
      <use href="#lp5"/>
      <use href="#lp6"/>
      <use href="#lp7"/>
      <use href="#lp8"/>
      <use href="#lp9"/>
    </clipPath>
  </defs>

  <style>
    .star { opacity: 0; animation: starIn 0.9s ease-out 0.2s forwards; }
    .L { opacity: 0; animation: blinkIn 1.1s linear forwards; }
    .l0 { animation-delay: 1.37s; }
    .l1 { animation-delay: 2.05s; }
    .l2 { animation-delay: 1.05s; }
    .l3 { animation-delay: 1.62s; }
    .l4 { animation-delay: 2.42s; }
    .l5 { animation-delay: 0.94s; }
    .l6 { animation-delay: 2.15s; }
    .l7 { animation-delay: 1.99s; }
    .l8 { animation-delay: 0.95s; }
    .l9 { animation-delay: 1.28s; }
    .by { opacity: 0; animation: fadeIn 0.7s ease-out 3.6s forwards; }
    .sheen { animation: sweep 2.8s linear 4.2s infinite; }
    @keyframes starIn { to { opacity: 1; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes blinkIn {
      0% { opacity: 0; } 8% { opacity: 1; } 16% { opacity: 0.05; }
      30% { opacity: 1; } 40% { opacity: 0; } 55% { opacity: 1; }
      64% { opacity: 0.15; } 78% { opacity: 1; } 100% { opacity: 1; }
    }
    @keyframes sweep {
      0% { transform: translateX(-340px); }
      100% { transform: translateX(1120px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .star, .L, .by { animation-duration: 0.01s; animation-delay: 0s; }
      .sheen { animation: none; }
    }
  </style>

